apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fintech-platform-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/narendra-clouds/cloud-devops-fintech-platform.git'
    targetRevision: HEAD
    path: kubernetes/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true